  :root{
    --sand: #E2D9BC;
    --foam: #F7E6CB;
    --ocean: #CB1B03;
    --ocean-deep: #683629;
    --citrus: #CB1B03;
    --coral: #B20E19;
    --ink: #683629;
    --ink-soft: #8A5A45;
    --line: rgba(104,54,41,0.28);
    --line-soft: rgba(104,54,41,0.14);
    --accent-blue: #25799B;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    background: var(--sand);
    color: var(--ink);
    font-family: 'Allora', 'Bagel Fat One', serif;
    font-size: 15px;
    line-height: 1.6;
    overflow-x: hidden;
    position: relative;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  /* paper grain overlay */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:999;
    opacity:0.05;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .display{
    font-family: 'Allora', 'Bagel Fat One', serif;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  a{ color:inherit; text-decoration:none; }

  .wrap{
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* ---------- NAV ---------- */

  header.site-nav{
    padding: 24px 0;
  }
  nav.wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding-bottom: 18px;
    border-bottom: 2px solid var(--ink);
  }
  .nav-links{
    display:flex;
    align-items:center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .nav-btn{
    display:inline-block;
    font-family: 'Allora', 'Bagel Fat One', serif;
    font-size: 0.85rem;
    color: var(--ink);
    padding: 4px 2px;
    background: transparent;
    transition: color 0.15s ease;
  }
  .nav-btn:hover{
    color: var(--coral);
  }
  .nav-right{
    display:flex;
    align-items:center;
    gap: 18px;
    font-family: 'Courier Prime', monospace;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }
  .badge{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 6px 13px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink-soft);
    font-size: 0.82rem;
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background: var(--accent-blue);
    flex-shrink:0;
  }

  /* ---------- BRAND HERO OVERLAY ---------- */
  .brand-hero-overlay{
    position: absolute;
    top: 2%;
    left: 50%;
    transform: translate(-50%, 0);
    z-index: 5;
    text-align: center;
    padding: 0 20px;
    max-width: 90%;
  }
  .brand-hero-overlay .label{
    display: inline-block;
    padding: 6px 20px;
    position: relative;
  }
  .brand-hero-overlay .mark-big{
    display: block;
    width: 8vw;
    min-width: 32px;
    max-width: 130px;
    height: auto;
    margin: 0 auto 0.8vw;
    color: var(--coral);
  }
  .brand-hero-overlay h1{
    font-family: 'Allora', 'Bagel Fat One', serif;
    font-size: 7vw;
    line-height: 1;
    letter-spacing: 0.01em;
    text-transform: lowercase;
    color: var(--ocean-deep);
  }
  .brand-hero-overlay .co-line{
    margin-top: -0.3vw;
    font-family: 'Allora', 'Bagel Fat One', serif;
    font-size: 2.1vw;
    letter-spacing: 0.05em;
    text-transform: lowercase;
    color: var(--coral);
  }

  /* ---------- ART ---------- */
  .art{
    padding: 20px 0 10px;
    position: relative;
  }
  .scene{
    position: relative;
    width: 100%;
    margin: 0;
    aspect-ratio: 2.5/1;
  }
  .scene svg{ width:100%; height:100%; display:block; }

  /* logo mark, used in footer */
  .brand-caps{
    font-family: 'Mesa Lane', 'Bagel Fat One', cursive;
    text-transform: lowercase;
    letter-spacing: 0.03em;
    color: var(--coral);
  }
  .logo{
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Mesa Lane', 'Bagel Fat One', cursive;
    font-size: 1.3rem;
    text-transform: lowercase;
    color: var(--coral);
    transition: transform 0.2s ease;
  }
  .logo:hover{
    transform: scale(1.05) rotate(-1deg);
  }
  .logo .mark{
    width: auto;
    height: 34px;
    flex-shrink: 0;
    color: var(--coral);
    transition: transform 0.25s ease;
  }
  .logo:hover .mark{
    transform: rotate(6deg);
  }

  .btn{
    display:inline-block;
    background: var(--coral);
    color: var(--foam);
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 0.98rem;
    font-weight: 500;
    transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .btn:hover{
    background: var(--coral);
    color: var(--foam);
    transform: translateY(-1px);
  }
  .btn.secondary{
    background: transparent;
    border: 2px solid var(--ocean-deep);
    color: var(--ocean-deep);
    padding: 12px 24px;
  }
  .btn.secondary:hover{
    background: var(--ocean-deep);
    color: var(--foam);
  }

  /* ---------- QUICK LINKS ---------- */
  .quick-links{
    display:flex;
    gap: 14px;
    justify-content:center;
    flex-wrap: wrap;
    padding: 10px 0 40px;
  }
  .quick-btn{
    display:inline-block;
    background: none;
    border: none;
    padding: 0;
    font-family: 'Mesa Lane', 'Bagel Fat One', cursive;
    font-size: 1.4rem;
    text-transform: lowercase;
    color: var(--ink);
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .quick-btn:hover{
    color: var(--coral);
  }

  /* ---------- FOOTER ---------- */
  footer{
    background: var(--sand);
    color: var(--ink-soft);
    padding: 10px 0 4px;
    border-top: 2px solid var(--ink);
  }
  .footer-links{
    display:flex;
    flex-direction: row;
    justify-content: center;
    align-items: baseline;
    gap: 20px;
    flex-wrap: wrap;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .footer-links a{
    font-family: 'Courier Prime', monospace;
    font-size: 0.8rem;
    color: var(--ocean-deep);
    transition: color 0.15s ease;
  }
  .footer-links a:hover{ color: var(--coral); }
  .footer-handle{
    display: inline-block;
    font-size: 1.2rem !important;
    font-weight: 700;
    color: var(--coral) !important;
    font-family: 'Allora', 'Bagel Fat One', serif;
    transition: transform 0.2s ease;
  }
  .footer-handle:hover{
    transform: scale(1.05) rotate(-1deg);
  }
  .footer-static{
    font-family: 'Courier Prime', monospace;
    font-size: 0.8rem;
    color: var(--ocean-deep);
  }
  .footer-bottom{
    padding-top: 4px;
    display:flex;
    justify-content:center;
    text-align: center;
    font-family: 'Courier Prime', monospace;
    font-size: 0.75rem;
    line-height: 1.2;
    color: var(--ink-soft);
    flex-wrap:wrap;
    gap: 8px;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 640px){
    .hide-mobile-inline{ display: none; }
    .footer-grid{ flex-direction: column; gap: 24px; }
    .footer-links{ flex-direction: column; align-items: center; }
    nav.wrap{ justify-content: center; text-align: center; }
    .nav-links{ justify-content: center; }
    .nav-right{ justify-content: center; width: 100%; }
  }

  :focus-visible{
    outline: 2px solid var(--accent-blue);
    outline-offset: 2px;
  }  /* ---------- MENU PAGE ---------- */
  .menu-page{
    padding-top: 40px;
    padding-bottom: 72px;
  }
  .menu-simple{
    max-width: 560px;
    margin: 0 auto;
  }
  .menu-section{
    padding: 36px 0;
  }
  .menu-section-title{
    font-family: 'Allora', 'Bagel Fat One', serif;
    text-transform: lowercase;
    text-align: center;
    color: var(--coral);
    font-size: 2rem;
    margin: 0 0 26px;
  }
  .menu-row{
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: 'Allora', 'Bagel Fat One', serif;
    font-size: 1rem;
    color: var(--ink);
    padding: 7px 0;
  }
  .menu-row .name{
    flex-shrink: 0;
    text-transform: lowercase;
  }
  .menu-row .leader{
    flex: 1;
    border-bottom: 2px dotted var(--coral);
    height: 0;
    margin-bottom: 4px;
    opacity: 0.6;
  }
  .menu-row .price{
    flex-shrink: 0;
    color: var(--coral);
  }
  .menu-divider{
    display: block;
    width: 100%;
    height: 14px;
    margin: 0 auto;
  }
  .story-text{
    font-family: 'Courier Prime', monospace;
