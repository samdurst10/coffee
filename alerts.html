<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>alerts — REDFISH Coffee</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<meta name="description" content="Get a text from Redfish Coffee when the trailer is parked near you. No spam, just good coffee.">
<meta property="og:title" content="alerts — REDFISH Coffee">
<meta property="og:description" content="Get a text from Redfish Coffee when the trailer is parked near you. No spam, just good coffee.">
<meta property="og:image" content="assets/img/favicon.png">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FAF6E2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Courier+Prime:wght@400;700&family=Chewy&family=Bagel+Fat+One&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Mesa Lane';
    src: url(assets/fonts/mesa-lane.woff2) format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Allora';
    src: url(assets/fonts/allora.woff2) format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  :root{
    --sand: #FAF6E2;
    --foam: #F7E6CB;
    --coral: #B20E19;
    --ink: #683629;
    --ink-soft: #8A5A45;
    --line: rgba(104,54,41,0.28);
    --line-soft: rgba(104,54,41,0.14);
    --accent-blue: #25799B;
  --sky-blue: #2E8B99;
  --sky-blue-text: #145A62;
  --rose: #C97B92;
  --rose-text: #8A4A5B;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    background: var(--sand);
    color: var(--ink);
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    font-size: 15px;
    line-height: 1.6;
    overflow-x: hidden;
    position: relative;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  /* paper grain overlay */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:999;
    opacity:0.3;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:998;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(104,54,41,0.12) 100%);
  }

  .display{
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  a{ color:inherit; text-decoration:none; }

  .wrap{
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* ---------- NAV ---------- */

  header.site-nav{
    padding: 24px 0;
    background: transparent;
    position: sticky;
    top: 0;
    z-index: 40;
  }
  nav.wrap{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap: 32px;
    flex-wrap: wrap;
    padding-bottom: 18px;
  }
  .nav-links{
    display:flex;
    align-items:center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .nav-btn{
    display:inline-block;
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    font-size: 0.85rem;
    color: var(--sky-blue);
    padding: 4px 2px;
    background: transparent;
    transition: color 0.15s ease, transform 0.15s ease;
  }
  .nav-btn:hover{
    color: var(--rose);
    transform: translateY(-1px);
  }
  .nav-btn.active{
    color: var(--coral);
    font-weight: 700;
    font-size: 1rem;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .hl{
    position: relative;
    z-index: 1;
  }
  .hl::before{
    content: "";
    position: absolute;
    z-index: -1;
    background: rgba(46, 139, 153, 0.42);
    filter: url(#rough);
  }
  .hl-navbtn{ display: inline-block; }
  .hl-navbtn::before{
    inset: 12% -10%;
    transform: rotate(-1.5deg);
    background: rgba(255,255,255,0.85);
    transition: background 0.15s ease;
  }

  .nav-right{
    display:flex;
    align-items:center;
    gap: 18px;
    font-family: 'Courier Prime', monospace;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }

  /* logo mark, used in footer */
.brand-caps{
  font-family: 'Mesa Lane', 'Bagel Fat One', cursive;
  text-transform: lowercase;
  letter-spacing: 0.03em;
  color: #fff;
  -webkit-text-stroke: 2px var(--coral);
  text-shadow:
    -1.2px -1.2px 0 var(--coral),
     1.2px -1.2px 0 var(--coral),
    -1.2px  1.2px 0 var(--coral),
     1.2px  1.2px 0 var(--coral),
    -2.6px -2.6px 0 var(--rose),
     2.6px -2.6px 0 var(--rose),
    -2.6px  2.6px 0 var(--rose),
     2.6px  2.6px 0 var(--rose);
}

  .logo{
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Mesa Lane', 'Bagel Fat One', cursive;
    font-size: 1.3rem;
    text-transform: lowercase;
    color: #fff;
    -webkit-text-stroke: 1px var(--coral);
    text-shadow:
      -1px -1px 0 var(--coral), 1px -1px 0 var(--coral),
      -1px 1px 0 var(--coral), 1px 1px 0 var(--coral);
    transition: transform 0.2s ease;
    margin-right: auto;
  }
  .logo:hover{
    transform: scale(1.05) rotate(-1deg);
  }
  .logo .mark{
    width: auto;
    height: 34px;
    flex-shrink: 0;
    color: var(--coral);
    transition: transform 0.25s ease;
    filter:
      drop-shadow(1.4px 0 0 var(--rose))
      drop-shadow(-1.4px 0 0 var(--rose))
      drop-shadow(0 1.4px 0 var(--rose))
      drop-shadow(0 -1.4px 0 var(--rose));
  }
  .logo:hover .mark{
    transform: rotate(6deg);
  }

  .logo .nav-word-main{ font-size: 1.6rem; }
  .logo .nav-word-sub{ font-size: 1.25rem; }

  .btn{
    display:inline-block;
    background: var(--coral);
    color: var(--foam);
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 0.98rem;
    font-weight: 500;
    transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .btn:hover{
    background: var(--coral);
    color: var(--foam);
    transform: translateY(-1px);
  }
  .btn.secondary{
    background: transparent;
    border: 2px solid var(--ink);
    color: var(--ink);
    padding: 12px 24px;
  }
  .btn.secondary:hover{
    background: var(--ink);
    color: var(--foam);
  }

  /* ---------- QUICK LINKS ---------- */
  .quick-links{
    display:flex;
    gap: 14px;
    justify-content:center;
    flex-wrap: wrap;
    padding: 10px 0 40px;
  }
  .quick-btn{
    display:inline-block;
    background: none;
    border: none;
    padding: 0;
    font-family: 'Mesa Lane', 'Bagel Fat One', cursive;
    font-size: 1.4rem;
    text-transform: lowercase;
    color: var(--ink);
    cursor: pointer;
    transition: color 0.18s ease, transform 0.15s ease, text-shadow 0.18s ease, -webkit-text-stroke 0.18s ease;
  }
  .quick-btn:hover{
    color: #fff;
    -webkit-text-stroke: 1px var(--sky-blue);
    text-shadow:
      -1px -1px 0 var(--sky-blue),
       1px -1px 0 var(--sky-blue),
      -1px  1px 0 var(--sky-blue),
       1px  1px 0 var(--sky-blue);
    transform: translateY(-1px);
  }

  /* ---------- FOOTER ---------- */
  footer{
    background: var(--sand);
    color: var(--ink-soft);
    padding: 10px 0 4px;
  }
  .footer-links{
    display:flex;
    flex-direction: row;
    justify-content: center;
    align-items: baseline;
    gap: 20px;
    flex-wrap: wrap;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .footer-links a{
    font-family: 'Courier Prime', monospace;
    font-size: 0.8rem;
    color: var(--ink);
    transition: color 0.15s ease;
  }
  .footer-links a:hover{ color: var(--coral); }
  .footer-handle{
    display: inline-block;
    font-size: 1.2rem !important;
    font-weight: 700;
    color: var(--coral) !important;
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    transition: transform 0.2s ease;
  }
  .footer-handle:hover{
    transform: scale(1.05) rotate(-1deg);
  }
  .footer-static{
    font-family: 'Courier Prime', monospace;
    font-size: 0.8rem;
    color: var(--ink);
  }
  .footer-bottom{
    padding-top: 4px;
    display:flex;
    justify-content:center;
    text-align: center;
    font-family: 'Courier Prime', monospace;
    font-size: 0.75rem;
    line-height: 1.2;
    color: var(--ink-soft);
    flex-wrap:wrap;
    gap: 8px;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 640px){
    .hide-mobile-inline{ display: none; }
    .footer-grid{ flex-direction: column; gap: 24px; }
    .footer-links{ flex-direction: column; align-items: center; }
    nav.wrap{ justify-content: center; text-align: center; }
    .nav-links{ justify-content: center; }
    .nav-right{ justify-content: center; width: 100%; }
  }

  :focus-visible{
    outline: 2px solid var(--sky-blue);
    outline-offset: 2px;
  }  /* ---------- MENU PAGE ---------- */
  .menu-page{
    padding: 42px 20px 72px;
  }
  .menu-simple{
    max-width: 560px;
    margin: 0 auto;
  }
  .page-title{
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    text-transform: lowercase;
    text-align: center;
    font-size: 4rem;
    line-height: 1;
    margin: 0 0 40px;
    color: var(--foam);
    -webkit-text-stroke: 3px var(--coral);
    text-shadow:
      -2px -2px 0 var(--coral),
       2px -2px 0 var(--coral),
      -2px  2px 0 var(--coral),
       2px  2px 0 var(--coral),
       0    3px 0 var(--coral);
  }
  @media (max-width: 640px){
    .page-title{ font-size: 2.8rem; }
  }
  .menu-section{
    padding: 36px 0;
  }
  .menu-section-title{
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    text-transform: lowercase;
    text-align: center;
    color: var(--coral);
    font-size: 2rem;
    margin: 0 0 26px;
  }
  .menu-row{
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    font-size: 1rem;
    color: var(--ink);
    padding: 7px 0;
  }
  .menu-row .name{
    flex-shrink: 0;
    text-transform: lowercase;
  }
  .menu-row .leader{
    flex: 1;
    border-bottom: 2px dotted var(--coral);
    height: 0;
    margin-bottom: 4px;
    opacity: 0.6;
  }
  .menu-row .price{
    flex-shrink: 0;
    color: var(--coral);
  }
  .menu-divider{
    display: block;
    width: 100%;
    height: 14px;
    margin: 0 auto;
  }
  .story-text{
    font-family: 'Courier Prime', monospace;
    font-size: 0.95rem;
    line-height: 1.7;
    color: var(--ink);
    margin: 0 0 18px;
  }
  .alerts-form{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    flex-wrap: wrap;
    margin-top: 26px;
  }
  .alerts-input{
    font-family: 'Courier Prime', monospace;
    font-size: 0.95rem;
    font-weight: 400;
    padding: 10px 4px;
    border: none;
    border-bottom: 1.5px solid var(--line);
    border-radius: 0;
    background: transparent;
    color: var(--ink);
    min-width: 220px;
    box-shadow: none;
    transition: border-color 0.2s ease;
  }
  .alerts-input::placeholder{
    color: var(--ink-soft);
    opacity: 0.6;
  }
  .alerts-input:focus{
    outline: none;
    border-bottom-color: transparent;
  }
  .rough-field{
    position: relative;
    display: inline-block;
  }
  .rough-field.block{ display: block; }
  .rough-field::after{
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: var(--coral);
    transform: scaleX(0);
    transition: transform 0.25s ease;
  }
  .rough-field:focus-within::after{
    transform: scaleX(1);
  }
  .social-links{
    display:flex;
    align-items:center;
    gap: 14px;
  }
  .social-link{
    display:flex;
    color: var(--rose);
    transition: color 0.15s ease, transform 0.15s ease;
  }
  .social-link:hover{
    color: var(--coral);
    transform: translateY(-1px);
  }
.social-icon{
  width: 38px;
  height: 38px;
  display: block;
}


  /* ---------- SOCIAL FOOTER ---------- */
  .site-footer{
    position: relative;
    padding: 28px 0 40px;
    text-align: center;
  }
  .site-footer::before{
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(rgba(226,217,188,0.94), rgba(226,217,188,0.94)),
      url("assets/img/menu-bg.jpg");
    background-size: cover;
    background-position: center 65%;
    filter: saturate(0.55);
  }

  .site-footer .social-links{
    justify-content: center;
  }
  .wave-stamp-link{
    display: block;
    width: 100px;
    margin: 26px auto 0;
    transition: transform 0.2s ease;
  }
  .wave-stamp-link:hover{
    transform: scale(1.06) rotate(-4deg);
  }
  .wave-stamp{
    width: 100%;
    aspect-ratio: 176 / 152;
    display: block;
    transform: rotate(3deg);
    background-color: var(--coral);
    -webkit-mask-image: url(assets/img/wave-stamp-coral.png);
    mask-image: url(assets/img/wave-stamp-coral.png);
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
    transition: background-color 0.2s ease;
  }
  .wave-stamp-link:hover .wave-stamp{
    background-color: var(--rose);
  }

  @media (max-width: 640px){
    nav.wrap{ flex-direction: column; align-items: center; text-align: center; }
    .logo{ margin-right: 0; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045 0.06" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>

<header class="site-nav">
  <nav class="wrap">
    <a href="index.html" class="logo">
      <img class="mark" src="assets/img/logo.png" alt="" aria-hidden="true">
      <span><span class="brand-caps nav-word-main">REDFISH</span> <span class="brand-caps nav-word-sub">Coffee</span></span>

    </a>
    <div class="nav-links">
      <a href="menu.html" class="nav-btn hl hl-navbtn">menu</a>
      <a href="find-us.html" class="nav-btn hl hl-navbtn">find us</a>
      <a href="contact.html" class="nav-btn hl hl-navbtn">contact</a>
      <a href="alerts.html" class="nav-btn hl hl-navbtn active">alerts</a>
      <a href="merch.html" class="nav-btn hl hl-navbtn">merch</a>
    </div>
  </nav>
</header>

<main class="wrap menu-page">
  <div class="menu-simple">
    <h1 class="page-title">alerts</h1>

    <div class="menu-section">
      <p class="story-text" style="text-align:center;">We move around. Get a text when we're parked near you — no spam, just where to find good coffee.</p>
      <div class="alerts-form">
        <span class="rough-field pill">
          <input type="tel" class="alerts-input" placeholder="your phone number" aria-label="Phone number">
        </span>
        <button type="button" class="quick-btn">sign me up</button>
      </div>
    </div>

  </div>
</main>


<footer class="site-footer">
  <div class="social-links">

  </div>
  <a class="wave-stamp-link" href="index.html" aria-label="Redfish Coffee — home">
    <div class="wave-stamp" role="img" aria-label=""></div>
  </a>
</footer>
