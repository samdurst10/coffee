<style>
  @font-face {
    font-family: 'Mesa Lane';
    src: url(assets/fonts/mesa-lane.woff2) format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Allora';
    src: url(assets/fonts/allora.woff2) format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  :root{
    --sand: #FAF0D2;
    --foam: #F7E6CB;
    --coral: #B20E19;
    --ink: #683629;
    --ink-soft: #8A5A45;
    --line: rgba(104,54,41,0.28);
    --line-soft: rgba(104,54,41,0.14);
    --accent-blue: #25799B;
  --sky-blue: #2E8B99;
  --sky-blue-text: #145A62;
  --rose: #C97B92;
  --rose-text: #8A4A5B;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    background: var(--sand);
    color: var(--ink);
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    font-size: 15px;
    line-height: 1.6;
    overflow-x: hidden;
    position: relative;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  /* paper grain overlay */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:999;
    opacity:0.3;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:998;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(104,54,41,0.12) 100%);
  }

  .display{
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  a{ color:inherit; text-decoration:none; }

  .wrap{
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* ---------- NAV ---------- */

  header.site-nav{
    padding: 24px 0;
  }
  nav.wrap{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap: 32px;
    flex-wrap: wrap;
    padding-bottom: 18px;
  }
  .nav-links{
    display:flex;
    align-items:center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .nav-btn{
    display:inline-block;
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    font-size: 0.85rem;
    color: var(--sky-blue);
    padding: 4px 2px;
    background: transparent;
    transition: color 0.15s ease, transform 0.15s ease;
  }
  .nav-btn:hover{
    color: var(--ink);
    transform: translateY(-1px);
  }
  .nav-right{
    display:flex;
    align-items:center;
    gap: 18px;
    font-family: 'Courier Prime', monospace;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }

/* ---------- BRAND HERO OVERLAY ---------- */
.hero-content{
  display: flex;
  flex-direction: column;
  align-items: center;
}
.hero-content .hl-mark,
.hero-content .hl-title,
.hero-content .hl-sub{
  display: block !important;
  text-align: center;
}

.hero-content > *{
  position: relative;
  z-index: 1;
}

.hero-brand{
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.hero-brand:hover{
  transform: scale(1.03) rotate(-1deg);
}

.hero-brand:hover .mark-big{
  transform: rotate(6deg);
}

.hero-content .mark-big{

.hero-content h1{
  font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
  font-size: 4.2rem;
  line-height: 1;
  text-transform: lowercase;

  color: #fff;
  -webkit-text-stroke: 4px var(--coral);
  text-shadow:
    -2.5px -2.5px 0 var(--coral),
     2.5px -2.5px 0 var(--coral),
    -2.5px  2.5px 0 var(--coral),
     2.5px  2.5px 0 var(--coral);
}

.hero-content h1 .brand-caps{
  color: #fff;
  -webkit-text-stroke: 4px var(--coral);
  text-shadow:
    -2.5px -2.5px 0 var(--coral),
     2.5px -2.5px 0 var(--coral),
    -2.5px  2.5px 0 var(--coral),
     2.5px  2.5px 0 var(--coral),
    -5px -5px 0 var(--rose),
     5px -5px 0 var(--rose),
    -5px  5px 0 var(--rose),
     5px  5px 0 var(--rose);
}


.hero-content .co-line{
  margin-top: 6px;
  font-family: 'Mesa Lane', 'Bagel Fat One', cursive;
  font-size: 2.1rem;
  text-transform: lowercase;

  /* Same look as redfish */
  color: #fff;
  -webkit-text-stroke: 3.25px var(--coral);
  text-shadow:
    -2.2px -2.2px 0 var(--coral),
     2.2px -2.2px 0 var(--coral),
