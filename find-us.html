    background-position: center;
    background-attachment: fixed;
    color: var(--ink);

    font-size: 15px;
    line-height: 1.6;
    overflow-x: hidden;
    position: relative;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  /* paper grain overlay */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:999;
    opacity:0.3;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:998;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(104,54,41,0.12) 100%);
  }

  .display{
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  a{ color:inherit; text-decoration:none; }

  .wrap{
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* ---------- NAV ---------- */

  header.site-nav{
    padding: 24px 0;
    background: var(--sand);
  }
  nav.wrap{
    display:flex;
    align-items:center;
    justify-content:flex-start;
    gap: 32px;
    flex-wrap: wrap;
    padding-bottom: 18px;
  }
  .nav-links{
    display:flex;
    align-items:center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .nav-btn{
    display:inline-block;
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    font-size: 0.85rem;
    color: var(--ink);
    padding: 4px 2px;
    background: transparent;
    transition: color 0.15s ease, transform 0.15s ease;
  }
  .nav-btn:hover{
    color: var(--coral);
    transform: translateY(-1px);
  }
  .nav-btn.active{
    color: var(--coral);
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .hl{
    position: relative;
    z-index: 1;
  }
  .hl::before{
    content: "";
    position: absolute;
    z-index: -1;
    background: rgba(37, 121, 155, 0.42);
    filter: url(#rough);
  }
  .hl-navbtn{ display: inline-block; }
  .hl-navbtn::before{ inset: 12% -10%; transform: rotate(-1.5deg); }
  .nav-right{
    display:flex;
    align-items:center;
    gap: 18px;
    font-family: 'Courier Prime', monospace;
    font-size: 0.9rem;
    color: var(--ink-soft);
  }

  /* ---------- BRAND HERO OVERLAY ---------- */
  .brand-hero-overlay{
    position: absolute;
    top: 2%;
    left: 50%;
    transform: translate(-50%, 0);
    z-index: 5;
    text-align: center;
    padding: 0 20px;
    max-width: 90%;
  }
  .brand-hero-overlay .label{
    display: inline-block;
    padding: 6px 20px;
    position: relative;
  }
  .brand-hero-overlay .mark-big{
    display: block;
    width: 8vw;
    min-width: 32px;
    max-width: 130px;
    height: auto;
    margin: 0 auto 0.8vw;
    color: var(--coral);
  }
  .brand-hero-overlay h1{
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    font-size: 7vw;
    line-height: 1;
    letter-spacing: 0.01em;
    text-transform: lowercase;
    color: var(--ink);
  }
  .brand-hero-overlay .co-line{
    margin-top: -0.3vw;
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    font-size: 2.1vw;
    letter-spacing: 0.05em;
    text-transform: lowercase;
    color: var(--coral);
  }

  /* ---------- ART ---------- */
  .art{
    padding: 20px 0 10px;
    position: relative;
  }
  .scene{
    position: relative;
    width: 100%;
    margin: 0;
    aspect-ratio: 2.5/1;
  }
  .scene svg{ width:100%; height:100%; display:block; }

  /* logo mark, used in footer */
.brand-caps{
  font-family: 'Mesa Lane', 'Bagel Fat One', cursive;
  text-transform: lowercase;
  letter-spacing: 0.03em;
  color: var(--sand);
  -webkit-text-stroke: 1.5px var(--coral);
  text-shadow:
    -1px -1px 0 var(--coral),
     1px -1px 0 var(--coral),
    -1px  1px 0 var(--coral),
     1px  1px 0 var(--coral);
}

  .logo{
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Mesa Lane', 'Bagel Fat One', cursive;
    font-size: 1.3rem;
    text-transform: lowercase;
    color: var(--sand);
    -webkit-text-stroke: 1px var(--coral);
    text-shadow:
      -1px -1px 0 var(--coral), 1px -1px 0 var(--coral),
      -1px 1px 0 var(--coral), 1px 1px 0 var(--coral);
    transition: transform 0.2s ease;
    margin-right: auto;
  }
  .logo:hover{
    transform: scale(1.05) rotate(-1deg);
  }
  .logo .mark{
    width: auto;
    height: 34px;
    flex-shrink: 0;
    color: var(--coral);
    transition: transform 0.25s ease;
  }
  .logo:hover .mark{
    transform: rotate(6deg);
  }

  .btn{
    display:inline-block;
    background: var(--coral);
    color: var(--foam);
    padding: 14px 26px;
    border-radius: 999px;
    font-size: 0.98rem;
    font-weight: 500;
    transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .btn:hover{
    background: var(--coral);
    color: var(--foam);
    transform: translateY(-1px);
  }
  .btn.secondary{
    background: transparent;
    border: 2px solid var(--ink);
    color: var(--ink);
    padding: 12px 24px;
  }
  .btn.secondary:hover{
    background: var(--ink);
    color: var(--foam);
  }

  /* ---------- QUICK LINKS ---------- */
  .quick-links{
    display:flex;
    gap: 14px;
    justify-content:center;
    flex-wrap: wrap;
    padding: 10px 0 40px;
  }
  .quick-btn{
    display:inline-block;
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    font-size: 0.9rem;
    padding: 12px 28px;
    border-radius: 999px;
    border: 2px solid var(--ink);
    background: var(--foam);
    color: var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }
  .quick-btn:hover{
    transform: translate(-2px,-2px);
    box-shadow: 6px 6px 0 var(--ink);
  }
  .quick-btn:hover{
    background: var(--coral);
    border-color: var(--coral);
    color: var(--foam);
  }

  /* ---------- FOOTER ---------- */
  footer{
    background: var(--sand);
    color: var(--ink-soft);
    padding: 10px 0 4px;
  }
  .footer-links{
    display:flex;
    flex-direction: row;
    justify-content: center;
    align-items: baseline;
    gap: 20px;
    flex-wrap: wrap;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .footer-links a{
    font-family: 'Courier Prime', monospace;
    font-size: 0.8rem;
    color: var(--ink);
    transition: color 0.15s ease;
  }
  .footer-links a:hover{ color: var(--coral); }
  .footer-handle{
    display: inline-block;
    font-size: 1.2rem !important;
    font-weight: 700;
    color: var(--coral) !important;
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    transition: transform 0.2s ease;
  }
  .footer-handle:hover{
    transform: scale(1.05) rotate(-1deg);
  }
  .footer-static{
    font-family: 'Courier Prime', monospace;
    font-size: 0.8rem;
    color: var(--ink);
  }
  .footer-bottom{
    padding-top: 4px;
    display:flex;
    justify-content:center;
    text-align: center;
    font-family: 'Courier Prime', monospace;
    font-size: 0.75rem;
    line-height: 1.2;
    color: var(--ink-soft);
    flex-wrap:wrap;
    gap: 8px;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 640px){
    .hide-mobile-inline{ display: none; }
    .footer-grid{ flex-direction: column; gap: 24px; }
    .footer-links{ flex-direction: column; align-items: center; }
    nav.wrap{ justify-content: center; text-align: center; }
    .nav-links{ justify-content: center; }
    .nav-right{ justify-content: center; width: 100%; }
  }

  :focus-visible{
    outline: 2px solid var(--accent-blue);
    outline-offset: 2px;
  }  /* ---------- MENU PAGE ---------- */
  .menu-page{
    padding: 40px 20px 72px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: calc(100vh - 200px);
  }
  .menu-simple{
    max-width: 560px;
    width: 100%;
    margin: 0 auto;
  }
  .find-us-title{
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    text-transform: lowercase;
    text-align: center;
    font-size: 3.4rem;
    line-height: 1;
    margin: 0;
    color: var(--foam);
    -webkit-text-stroke: 3px var(--coral);
    text-shadow:
      -2px -2px 0 var(--coral),
       2px -2px 0 var(--coral),
      -2px  2px 0 var(--coral),
       2px  2px 0 var(--coral);
  }
  .menu-section{
    padding: 24px 0;
  }
  .menu-section-title{
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    text-transform: lowercase;
    text-align: center;
    color: var(--foam);
    -webkit-text-stroke: 2px var(--coral);
    text-shadow:
      -1.5px -1.5px 0 var(--coral),
       1.5px -1.5px 0 var(--coral),
      -1.5px  1.5px 0 var(--coral),
       1.5px  1.5px 0 var(--coral);
    font-size: 2rem;
    margin: 0 0 26px;
  }
  .menu-row{
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: 'Mesa Lane', 'Allora', 'Bagel Fat One', cursive;
    font-size: 1rem;
    color: var(--foam);
    -webkit-text-stroke: 1px var(--ink);
    text-shadow:
      -1px -1px 0 var(--ink),
       1px -1px 0 var(--ink),
      -1px  1px 0 var(--ink),
       1px  1px 0 var(--ink);
    padding: 7px 0;
  }
  .menu-row .name,
  .menu-row .price{
    -webkit-text-stroke: 1px var(--ink);
    text-shadow:
      -1px -1px 0 var(--ink),
       1px -1px 0 var(--ink),
      -1px  1px 0 var(--ink),
       1px  1px 0 var(--ink);
  }
  .menu-row .name{
    flex-shrink: 0;
    text-transform: lowercase;
  }
  .menu-row .leader{
    flex: 1;
    border-bottom: 3px dotted var(--foam);
    height: 0;
    margin-bottom: 4px;
    opacity: 0.9;
  }
  .menu-row .price{
    flex-shrink: 0;
    color: var(--foam);
  }
  .menu-divider{
    display: block;
    width: 100%;
    height: 14px;
    margin: 0 auto;
  }
  .find-us-map-wrap{
    margin: 18px 0 6px;
    border-radius: 14px;
    overflow: hidden;
    border: 3px solid var(--foam);
    box-shadow: 0 10px 24px rgba(58,23,16,0.35);
  }
  .find-us-map{
    display: block;
    width: 100%;
    height: 280px;
    border: 0;
  }
  .today-callout{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    font-family: 'Mesa Lane', 'Bagel Fat One', cursive;
    font-size: 1.4rem;
    color: var(--foam);
    -webkit-text-stroke: 1.5px var(--coral);
    text-shadow:
      -1px -1px 0 var(--coral),
       1px -1px 0 var(--coral),
      -1px  1px 0 var(--coral),
       1px  1px 0 var(--coral);
    background: rgba(58,23,16,0.4);
    border: 2px solid var(--foam);
    border-radius: 999px;
    padding: 14px 28px;
    margin: 0 auto;
    max-width: fit-content;
  }
  .today-dot{
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--foam);
    box-shadow: 0 1px 3px rgba(58,23,16,0.55);
    flex-shrink: 0;
  }
  .today-sep{ opacity: 0.7; }
  .menu-row.is-today{
    color: var(--foam);
    font-weight: 700;
    background: rgba(58,23,16,0.32);
    border-radius: 8px;
    padding: 7px 8px;
    margin: 0 -8px;
  }
  .menu-row.is-today .leader{
    border-bottom-color: var(--foam);
    opacity: 1;
  }
  .social-links{
    display:flex;
    align-items:center;
    gap: 14px;
  }
  .social-link{
    display:flex;
    color: var(--ink);
    transition: color 0.15s ease, transform 0.15s ease;
  }
  .social-link:hover{
    color: var(--coral);
    transform: translateY(-1px);
  }
.social-icon{
  width: 30px;
  height: 30px;
  display: block;
}


  /* ---------- SOCIAL FOOTER ---------- */
  .site-footer{
    padding: 28px 0 40px;
    text-align: center;
  }
  .site-footer .social-links{
    justify-content: center;
  }

  @media (max-width: 640px){
    nav.wrap{ flex-direction: column; align-items: center; text-align: center; }
    .logo{ margin-right: 0; justify-content: center; }
  }
</style>

<script>
  (function(){
    var schedule = {
      Monday:    { location: "Main Beach, Laguna",    hours: "8am – 1pm", map: "Main Beach, Laguna Beach, CA" },
      Tuesday:   { location: "Heisler Park, Laguna",  hours: "8am – 1pm", map: "Heisler Park, Laguna Beach, CA" },
      Wednesday: { location: "Off today",             hours: "",          map: "Laguna Beach, CA" },
      Thursday:  { location: "Aliso Beach, Laguna",   hours: "8am – 1pm", map: "Aliso Beach, Laguna Beach, CA" },
      Friday:    { location: "Main Beach, Laguna",    hours: "8am – 1pm", map: "Main Beach, Laguna Beach, CA" },
      Saturday:  { location: "Farmers Market, Laguna",hours: "8am – 1pm", map: "Laguna Beach Farmers Market, Laguna Beach, CA" },
      Sunday:    { location: "Crystal Cove",          hours: "8am – 1pm", map: "Crystal Cove State Park, CA" }
    };
    var days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    var today = days[new Date().getDay()];
    var info = schedule[today];

    var locEl = document.getElementById('today-location');
    var hoursEl = document.getElementById('today-hours');
    var sepEl = document.querySelector('.today-sep');
    var mapEl = document.getElementById('find-us-map');
    if (locEl) locEl.textContent = info.location;
    if (info.hours) {
      if (hoursEl) hoursEl.textContent = info.hours;
    } else {
      if (hoursEl) hoursEl.style.display = 'none';
      if (sepEl) sepEl.style.display = 'none';
    }
    if (mapEl) {
      mapEl.src = 'https://www.google.com/maps?q=' + encodeURIComponent(info.map) + '&output=embed';
    }

    var row = document.querySelector('.menu-row[data-day="' + today + '"]');
    if (row) row.classList.add('is-today');
  })();
</script>
